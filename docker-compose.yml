services:
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper-cpu
    environment:
      # Chú ý: Dùng tên model đầy đủ hoặc kiểm tra lại cú pháp
      - WHISPER__MODEL=Systran/faster-whisper-small
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
    ports:
      - "9000:8000" # Container này mặc định chạy port 8000 bên trong
    volumes:
      - ./whisper-cache:/root/.cache/huggingface # Faster-whisper server thường lưu ở đây
    restart: unless-stopped